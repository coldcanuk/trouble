name: materialize-hero
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JPEG and commit
        run: |
          set -euo pipefail
          curl -sSL -o trouble-skill.jpg "https://files.catbox.moe/y1ymbq.jpg"
          python3 - << 'PY'
          from pathlib import Path
          import hashlib
          raw = Path('trouble-skill.jpg').read_bytes()
          assert raw[:3] == b'\xff\xd8\xff', raw[:8]
          h = hashlib.sha256(raw).hexdigest()
          assert h == '9d20618f2f38a1a8ff5b6c7daa22eda68c8d02e5fc71d08bcbb19bfa461f6efb', h
          print('ok', len(raw), h)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trouble-skill.jpg
          if git diff --cached --quiet; then
            echo 'hero already present'
            exit 0
          fi
          git commit -m "Add README hero image trouble-skill.jpg"
          git push
